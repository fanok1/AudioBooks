<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Проверка соединения — lis10book.com</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fcfcfd; --surface: #ffffff; --track: #eceef2;
    --ink: #17181c; --muted: #6b7280; --faint: #9aa3af; --line: #e8eaee;
    --accent: #e03a2b; --accent2: #c22f22;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10161d; --surface: #161d26; --track: #243040;
      --ink: #e8eef5; --muted: #9aa8b8; --faint: #7c8a9a; --line: #232c38;
      --accent: #ff5a45; --accent2: #e03a2b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--ink); padding: 20px;
  }
  .box { width: 100%; max-width: 420px; text-align: center; }

  .player {
    display: flex; align-items: center; gap: 14px; text-align: left;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 18px; padding: 14px; margin-bottom: 18px;
    box-shadow: 0 12px 34px rgba(20, 24, 33, .10);
  }
  .cover {
    position: relative; flex: 0 0 62px; width: 62px; height: 62px;
    border-radius: 14px; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    box-shadow: 0 6px 18px rgba(224, 58, 43, .38);
  }
  .eq { display: flex; align-items: flex-end; gap: 3px; height: 26px; }
  .eq span {
    width: 4px; height: 8px; border-radius: 2px; background: rgba(255, 255, 255, .92);
    animation: eq 900ms ease-in-out infinite;
  }
  .eq span:nth-child(2) { animation-delay: 150ms; }
  .eq span:nth-child(3) { animation-delay: 300ms; }
  .eq span:nth-child(4) { animation-delay: 450ms; }
  @keyframes eq { 0%, 100% { height: 8px; } 50% { height: 24px; } }

  .meta { flex: 1; min-width: 0; }
  .meta .title { font-weight: 700; font-size: 15.5px; color: var(--ink); }
  .meta .sub { font-size: 13px; color: var(--muted); margin-top: 1px; }
  .barrow { display: flex; align-items: center; gap: 10px; margin-top: 11px; }
  .bar { position: relative; flex: 1; height: 6px; border-radius: 999px; background: var(--track); overflow: hidden; }
  .bar i {
    position: absolute; top: 0; left: -42%; height: 100%; width: 42%;
    border-radius: 999px; background: var(--accent); animation: slide 1.4s ease-in-out infinite;
  }
  @keyframes slide { 0% { left: -42%; } 100% { left: 100%; } }
  .time { font-variant-numeric: tabular-nums; font-size: 12px; color: var(--muted); flex: 0 0 auto; }

  .lead { margin: 0 0 20px; font-size: 14px; color: var(--muted); }
  .cf { display: flex; justify-content: center; min-height: 70px; }
  .hint { font-size: 13px; color: var(--faint); margin-top: 18px; }
  .logo { display: block; font-weight: 800; font-size: 15px; letter-spacing: .2px; color: var(--accent); margin-bottom: 16px; }

  @media (prefers-reduced-motion: reduce) {
    .eq span, .bar i { animation: none; }
    .eq span { height: 16px; }
    .bar i { left: 0; width: 60%; }
  }
</style>
</head>
<body>
  <div class="box">
    <span class="logo">lis10book.com</span>
    <div class="player">
      <div class="cover" aria-hidden="true">
        <div class="eq"><span></span><span></span><span></span><span></span></div>
      </div>
      <div class="meta">
        <div class="title">Готовим воспроизведение</div>
        <div class="sub">Проверяем, что вы не робот</div>
        <div class="barrow">
          <div class="bar"><i></i></div>
          <span class="time" id="t">0:00</span>
        </div>
      </div>
    </div>
    <p class="lead">Пара секунд — и продолжим слушать. Так мы защищаемся от автоматических запросов.</p>
    <div class="cf"><div id="cf"></div></div>
    <p class="hint" id="hint" hidden>Если проверка не проходит — обновите страницу или отключите блокировщик рекламы для этого сайта.</p>
    <noscript><p class="hint" style="display:block">Для доступа к сайту включите JavaScript.</p></noscript>
  </div>
<script>
// ВАЖНО: колбэк объявляем ДО загрузки api.js — скрипт грузится async и зовёт
// onload сразу, иначе виджет не отрисуется и страница «висит».
var sent = false;
var secs = 0;
setInterval(function () {
  secs++;
  var m = Math.floor(secs / 60), s = secs % 60;
  var el = document.getElementById("t");
  if (el) el.textContent = m + ":" + (s < 10 ? "0" : "") + s;
}, 1000);
function guardHint(msg) {
  var h = document.getElementById("hint");
  if (msg) h.textContent = msg;
  h.hidden = false;
}
function guardDone(token) {
  if (!token || sent) return;
  sent = true;
  fetch("/api/guard/verify", {
    method: "POST",
    headers: { "content-type": "application/json" },
    credentials: "include",
    body: JSON.stringify({ token: token })
  }).then(function (r) {
    if (!r.ok) throw new Error("verify " + r.status);
    // Обычный случай — контент подменён на исходном URL: просто перезагружаем.
    // Прямой заход на /guard — уходим по ?to= (только внутренний путь) или на главную,
    // иначе перезагрузка снова показала бы проверку (петля).
    if (location.pathname.indexOf("/guard") === 0) {
      var to = new URLSearchParams(location.search).get("to") || "/";
      if (to.charAt(0) !== "/" || to.charAt(1) === "/") to = "/";
      location.replace(to);
    } else {
      location.reload();
    }
  }).catch(function (e) {
    sent = false;
    guardHint("Не удалось подтвердить проверку (" + e.message + "). Обновите страницу.");
  });
}
window.cfInit = function () {
  if (!window.turnstile) { guardHint("Проверка не загрузилась. Отключите блокировщик и обновите страницу."); return; }
  window.turnstile.render("#cf", {
    sitekey: "0x4AAAAAAEPtVo8R-omHgJhL",
    theme: "auto",
    callback: guardDone,
    "error-callback": function (code) { guardHint("Проверка не прошла (код " + code + "). Обновите страницу."); }
  });
};
setTimeout(function () { if (!sent) guardHint(); }, 12000);
</script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=cfInit" async defer></script>
</body>
</html>
