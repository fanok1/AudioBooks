# Signed release build. Pushing a tag v<versionName> (e.g. v7.3) builds the signed APK and AAB and publishes them as a
# GitHub release; running the workflow manually builds the same signed files as workflow artifacts only (a dry run).
# Signing comes from repository secrets; see docs/howto.md, "Continuous integration and releases".
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build signed release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Read app version
        id: version
        run: |
          name=$(sed -n 's/^[[:space:]]*versionName[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle)
          code=$(sed -n 's/^[[:space:]]*versionCode[[:space:]]*\([0-9][0-9]*\).*/\1/p' app/build.gradle)
          if [ -z "$name" ] || [ -z "$code" ]; then
            echo "::error file=app/build.gradle::versionName or versionCode not found"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Version $name ($code)"

      - name: Check that the tag matches versionName
        if: github.ref_type == 'tag'
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          if [ "${GITHUB_REF_NAME#v}" != "$VERSION_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $VERSION_NAME in app/build.gradle (expected v$VERSION_NAME)"
            exit 1
          fi

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. See docs/howto.md, section 'Continuous integration and releases'."
            exit 1
          fi
          keystore="$RUNNER_TEMP/release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          # keystore.properties is read with java.util.Properties, where a backslash is an escape character.
          escape() { printf '%s' "$1" | sed 's/\\/\\\\/g'; }
          {
            echo "storeFile=$keystore"
            echo "storePassword=$(escape "$ANDROID_KEYSTORE_PASSWORD")"
            echo "keyAlias=$(escape "$ANDROID_KEY_ALIAS")"
            echo "keyPassword=$(escape "$ANDROID_KEY_PASSWORD")"
          } > keystore.properties

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Build signed APK and App Bundle
        run: ./gradlew :app:assembleRelease :app:bundleRelease --console=plain

      - name: Verify signature and collect files
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner
          "$apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          mkdir -p dist
          base="AudioBooks-$VERSION_NAME"
          cp app/build/outputs/apk/release/app-release.apk "dist/$base.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/$base.aab"
          cp app/build/outputs/mapping/release/mapping.txt "dist/$base-mapping.txt"
          (cd dist && sha256sum "$base.apk" "$base.aab" > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: AudioBooks-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}
          path: dist/
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          name: AudioBooks ${{ steps.version.outputs.name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            dist/*.apk
            dist/*.aab
            dist/SHA256SUMS.txt

      - name: Remove signing material
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.jks"
